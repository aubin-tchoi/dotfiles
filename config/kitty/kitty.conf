# Personal Kitty settings. Defaults: https://sw.kovidgoyal.net/kitty/conf/

background_opacity 1.0
background_blur 1

# advance
term xterm-kitty

# terminal bell
enable_audio_bell no

# os specific tweaks (Gnome window decoration for wayland)
linux_display_server x11

# font
# font_family        SauceCodePro Nerd Font
# bold_font          auto
# italic_font        auto
# bold_italic_font   auto
font_size 12.0

# font size management
map ctrl+shift+backspace change_font_size all 0

# cursor customization
# block / beam / underline
cursor_shape block
cursor_blink_interval 0
cursor_stop_blinking_after 0
shell_integration no-cursor

# scrollback
scrollback_lines 5000
wheel_scroll_multiplier 3.0

# mouse
mouse_hide_wait -1

# window layout
remember_window_size  no
initial_window_width  1200
initial_window_height 750
window_border_width 1.5pt
window_padding_width 0
window_margin_width 2
hide_window_decorations no

# window management
map ctrl+shift+enter new_window
map ctrl+shift+] next_window
map ctrl+shift+[ previous_window

# layout management
map ctrl+shift+l next_layout
map ctrl+alt+r goto_layout tall
map ctrl+alt+s goto_layout stack

# line navigation (move to beginning/end of line)
map cmd+left send_text all \x01
map cmd+right send_text all \x05

# word navigation (move between words)
map alt+left send_text all \x1bb
map alt+right send_text all \x1bf

# delete operations
map cmd+backspace send_text all \x15
map alt+backspace send_text all \x17

# scrollback search
map cmd+f launch --type=overlay --stdin-source=@screen_scrollback fzf --no-sort --no-mouse --exact -i --tac

# tab switching
map cmd+1 goto_tab 1
map cmd+2 goto_tab 2
map cmd+3 goto_tab 3
map cmd+4 goto_tab 4
map cmd+5 goto_tab 5
map cmd+6 goto_tab 6
map cmd+7 goto_tab 7
map cmd+8 goto_tab 8
map cmd+9 goto_tab 9
map cmd+shift+t set_tab_title

# splits (iTerm2-style)
map cmd+d launch --location=vsplit --cwd=current
map cmd+shift+d launch --location=hsplit --cwd=current
map cmd+w close_window
map cmd+shift+left neighboring_window left
map cmd+shift+right neighboring_window right
map cmd+shift+up neighboring_window up
map cmd+shift+down neighboring_window down
enabled_layouts splits,tall,stack

# tab bar customization
tab_bar_edge top
tab_bar_margin_width 10
tab_bar_margin_height 15 0
tab_bar_style fade
tab_fade 0
tab_title_template          "{fmt.bg._080808}{fmt.fg._303030}{fmt.fg.default}{fmt.bg._303030}{fmt.fg._c6c6c6} {title} {fmt.fg.default}{fmt.bg.default}{fmt.fg._303030}{fmt.fg.default}"
active_tab_title_template   "{fmt.bg._080808}{fmt.fg._80a0ff}{fmt.fg.default}{fmt.bg._80a0ff}{fmt.fg._080808} {title} {fmt.fg.default}{fmt.bg.default}{fmt.fg._80a0ff}{fmt.fg.default}"
active_tab_font_style normal
inactive_tab_font_style normal

# BEGIN_KITTY_FONTS
font_family      family="JetBrains Mono"
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS


# BEGIN_KITTY_THEME
# Atelier Heath Dark
include current-theme.conf
# END_KITTY_THEME
#
allow_remote_control yes
listen_on unix:/tmp/mykitty

env GLFW_SILENCE_ERRORS=1
